name: Java_Native_Linux_x86_64

# Builds the Linux x86_64 native code (C++ libraries + libGraphMolWrap.so, with InChI) and org.RDKit.jar
# inside an AlmaLinux 9 container (binary-compatible with RHEL 9: glibc 2.34, gcc 11), using
# Scripts/windows_java_build/build-linux.sh. The build fails if the .so needs glibc newer than 2.34, and
# the Dockerfile runs the Java smoke tests on Linux. Artifact: rdkit-linux-x86_64.
#
# Run it by hand (Actions > Run workflow) or call it from java_api.yml.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux_x86_64:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7

      # The container build needs several GB for the build tree; the stock runner image has plenty of
      # preinstalled tooling we do not use.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h /

      # buildx with the docker-container driver: required to import/export the layer cache below.
      - uses: docker/setup-buildx-action@v3

      - name: Pick job count (RDKit translation units need ~2 GB each)
        run: |
          mem_gb=$(awk '/MemTotal/ {print int($2/1048576)}' /proc/meminfo)
          jobs=$(nproc); cap=$(( mem_gb / 2 )); [ "$cap" -lt "$jobs" ] && jobs=$cap
          [ "$jobs" -lt 1 ] && jobs=1
          echo "JOBS=$jobs" >> "$GITHUB_ENV"
          echo "cores=$(nproc) mem=${mem_gb}GB -> JOBS=$jobs"

      # Cache of the SWIG + Boost layers (the Dockerfile's "deps" stage), which do not depend on RDKit source.
      - name: Restore SWIG/Boost layer cache
        id: deps-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/deps-cache
          key: linux-deps-${{ hashFiles('Scripts/windows_java_build/linux/Dockerfile') }}-j${{ env.JOBS }}
          restore-keys: linux-deps-${{ hashFiles('Scripts/windows_java_build/linux/Dockerfile') }}-

      - name: Build (container)
        env:
          BUILDROOT: ${{ runner.temp }}/rdkit
          DEPS_CACHE_DIR: ${{ runner.temp }}/deps-cache
        run: bash Scripts/windows_java_build/build-linux.sh

      - name: Save SWIG/Boost layer cache
        if: always() && steps.deps-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/deps-cache
          key: linux-deps-${{ hashFiles('Scripts/windows_java_build/linux/Dockerfile') }}-j${{ env.JOBS }}

      - name: Show portability info
        run: |
          cat "$RUNNER_TEMP/rdkit/linux/java-dist/min-glibc.txt"
          cat "$RUNNER_TEMP/rdkit/linux/java-dist/ldd.txt"

      - name: Stage artifact
        run: |
          stage="$RUNNER_TEMP/out"
          mkdir -p "$stage"
          cp -r "$RUNNER_TEMP/rdkit/linux/java-dist" "$stage/java-dist"
          cp "$RUNNER_TEMP/rdkit/linux/rdkit-linux-x86_64.tar.gz" "$stage/"
          ( cd "$stage" && find . -type f -exec ls -l {} + )

      - uses: actions/upload-artifact@v4
        with:
          name: rdkit-linux-x86_64
          path: ${{ runner.temp }}/out
          if-no-files-found: error
          retention-days: 30

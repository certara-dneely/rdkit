name: Java_Native_macOS_arm64

# Builds the macOS arm64 native code (C++ libraries + libGraphMolWrap.dylib, with InChI) and the
# org.RDKit.jar produced alongside it, natively on a macos-15 runner, using
# Scripts/windows_java_build/build-macos.sh (Boost built from source, static; deployment target 12.0;
# FreeType off so the library depends only on system libraries; the script fails if it does not).
# Artifact: rdkit-macos-arm64.
#
# Run it by hand (Actions > Run workflow) or call it from java_api.yml.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos_arm64:
    runs-on: macos-15
    timeout-minutes: 240
    env:
      BOOST_VERSION: "1.92.0"
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        id: jdk
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install build tools
        run: brew install ninja swig   # cmake is preinstalled on the runner

      - name: Restore Boost cache
        id: boost-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/rdkit/boost-${{ env.BOOST_VERSION }}-arm64
          key: boost-macos-arm64-${{ env.BOOST_VERSION }}-${{ hashFiles('Scripts/windows_java_build/build-macos.sh') }}

      - name: Build
        env:
          BUILDROOT: ${{ runner.temp }}/rdkit
          JAVA_HOME: ${{ steps.jdk.outputs.path }}
        run: bash Scripts/windows_java_build/build-macos.sh

      - name: Save Boost cache
        if: success() && steps.boost-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/rdkit/boost-${{ env.BOOST_VERSION }}-arm64
          key: boost-macos-arm64-${{ env.BOOST_VERSION }}-${{ hashFiles('Scripts/windows_java_build/build-macos.sh') }}

      - name: Stage artifact
        run: |
          stage="$RUNNER_TEMP/out"
          mkdir -p "$stage"
          cp -r "$RUNNER_TEMP/rdkit/java-dist" "$stage/java-dist"
          cp "$RUNNER_TEMP/rdkit/rdkit-macos-arm64-install.tar.gz" "$stage/"
          ( cd "$stage" && find . -type f -exec ls -l {} + )

      - uses: actions/upload-artifact@v4
        with:
          name: rdkit-macos-arm64
          path: ${{ runner.temp }}/out
          if-no-files-found: error
          retention-days: 30

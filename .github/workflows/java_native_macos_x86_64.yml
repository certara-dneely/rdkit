name: Java_Native_macOS_x86_64

# Builds the macOS x86_64 native code (C++ libraries + libGraphMolWrap.dylib, with InChI) and the
# org.RDKit.jar produced alongside it, natively on a macos-15-intel runner, using
# Scripts/windows_java_build/build-macos.sh (Boost built from source, static; deployment target 12.0;
# FreeType off so the library depends only on system libraries; the script fails if it does not).
# Artifact: rdkit-macos-x86_64.
#
# Optional signing (input "sign"): the libraries are signed with the Developer ID certificate (hardened
# runtime + timestamp) inside build-macos.sh, so the tarball and the artifact hold signed files, and are then
# notarized by Apple. See Scripts/windows_java_build/README.md for the secrets.
#
# Run it by hand (Actions > Run workflow) or call it from java_api.yml.
on:
  workflow_dispatch:
    inputs:
      sign:
        description: Code-sign the libraries and notarize them (needs the MACOS_CERT_* and NOTARY_* secrets)
        type: boolean
        default: false
  workflow_call:
    inputs:
      sign:
        type: boolean
        default: false
    secrets:
      MACOS_CERT_P12_BASE64:
        required: false
      MACOS_CERT_PASSWORD:
        required: false
      NOTARY_APPLE_ID:
        required: false
      NOTARY_PASSWORD:
        required: false
      NOTARY_TEAM_ID:
        required: false

permissions:
  contents: read

jobs:
  macos_x86_64:
    runs-on: macos-15-intel
    timeout-minutes: 240
    env:
      BOOST_VERSION: "1.92.0"
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        id: jdk
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install build tools
        run: brew install ninja swig   # cmake is preinstalled on the runner

      - name: Restore Boost cache
        id: boost-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/rdkit/boost-${{ env.BOOST_VERSION }}-x86_64
          key: boost-macos-x86_64-${{ env.BOOST_VERSION }}-${{ hashFiles('Scripts/windows_java_build/build-macos.sh') }}

      # A throw-away keychain holds the Developer ID identity for this job only.
      - name: Import signing certificate
        if: ${{ inputs.sign }}
        env:
          CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          SIGN_IDENTITY: ${{ vars.MACOS_SIGN_IDENTITY || 'Certara USA, Inc.' }}
        run: |
          [ -n "$CERT_P12_BASE64" ] && [ -n "$CERT_PASSWORD" ]             || { echo "::error::secrets MACOS_CERT_P12_BASE64 and MACOS_CERT_PASSWORD are required to sign"; exit 1; }
          kc="$RUNNER_TEMP/signing.keychain-db"; kcpw="$(uuidgen)"
          echo "$CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$kcpw" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$kcpw" "$kc"
          security import "$RUNNER_TEMP/cert.p12" -k "$kc" -P "$CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kcpw" "$kc" > /dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$kc" | tee "$RUNNER_TEMP/identities.txt"
          grep -q -F "$SIGN_IDENTITY" "$RUNNER_TEMP/identities.txt"             || { echo "::error::no code-signing identity matching '$SIGN_IDENTITY' in the imported certificate"; exit 1; }
          echo "SIGN_KEYCHAIN=$kc" >> "$GITHUB_ENV"

      - name: Build
        env:
          BUILDROOT: ${{ runner.temp }}/rdkit
          JAVA_HOME: ${{ steps.jdk.outputs.path }}
          SIGN_IDENTITY: ${{ inputs.sign && (vars.MACOS_SIGN_IDENTITY || 'Certara USA, Inc.') || '' }}
          KEYCHAIN: ${{ env.SIGN_KEYCHAIN }}
        run: bash Scripts/windows_java_build/build-macos.sh

      - name: Save Boost cache
        if: success() && steps.boost-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/rdkit/boost-${{ env.BOOST_VERSION }}-x86_64
          key: boost-macos-x86_64-${{ env.BOOST_VERSION }}-${{ hashFiles('Scripts/windows_java_build/build-macos.sh') }}

      # Apple notarization of the signed libraries (the files are not modified; bare dylibs cannot be stapled).
      - name: Notarize
        if: ${{ inputs.sign }}
        env:
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
        run: |
          [ -n "$NOTARY_APPLE_ID" ] && [ -n "$NOTARY_PASSWORD" ] && [ -n "$NOTARY_TEAM_ID" ]             || { echo "::error::secrets NOTARY_APPLE_ID, NOTARY_PASSWORD and NOTARY_TEAM_ID are required to notarize"; exit 1; }
          bash Scripts/windows_java_build/notarize-macos.sh "$RUNNER_TEMP/rdkit/java-dist" "$RUNNER_TEMP/rdkit/install/lib"

      - name: Remove signing keychain
        if: ${{ always() && inputs.sign }}
        run: |
          [ -n "${SIGN_KEYCHAIN:-}" ] && security delete-keychain "$SIGN_KEYCHAIN" || true

      - name: Stage artifact
        run: |
          stage="$RUNNER_TEMP/out"
          mkdir -p "$stage"
          cp -r "$RUNNER_TEMP/rdkit/java-dist" "$stage/java-dist"
          cp "$RUNNER_TEMP/rdkit/rdkit-macos-x86_64-install.tar.gz" "$stage/"
          ( cd "$stage" && find . -type f -exec ls -l {} + )

      - uses: actions/upload-artifact@v4
        with:
          name: rdkit-macos-x86_64
          path: ${{ runner.temp }}/out
          if-no-files-found: error
          retention-days: 30

name: WASM_MinimalLib

# Builds the WebAssembly / JavaScript library (RDKit MinimalLib: RDKit_minimal.js, .wasm, .d.ts) with
# RDKit's own Docker recipe (Code/MinimalLib/scripts/build_rdkitjs.sh) via
# Scripts/windows_java_build/build-wasm.sh, then runs the MinimalLib JS tests against the result.
# The script builds the committed source (git HEAD) and patches the staged copy of 01_deps.Dockerfile
# (zlib 1.3.2 + the floating "latest" emsdk fails to link zlib's test target otherwise).
# Artifact: rdkit-wasm (the contents of Code/MinimalLib/build: dist/ plus package.json).
#
# Optionally publishes to JFrog (certara-maven-develop-local) as org.rdkit:rdkit-minimallib:<version>:
# a zip of the package folder plus the js / wasm / types files as classifiers (publish-jfrog-wasm.sh).
#
# This is separate from the Java workflows: it has no JNI/Java part, and no InChI by default.
# Run it by hand (Actions > Run workflow) or call it from another workflow.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to JFrog (needs JFROG_USERNAME / JFROG_ACCESS_TOKEN secrets)
        type: boolean
        default: false
      version:
        description: Maven version to publish (empty = RDKit version from CMakeLists.txt, e.g. 2026.09.2)
        type: string
        default: ""
  workflow_call:
    inputs:
      publish:
        type: boolean
        default: false
      version:
        type: string
        default: ""
    secrets:
      JFROG_USERNAME:
        required: false
      JFROG_ACCESS_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  wasm:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h /

      - uses: docker/setup-buildx-action@v3

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # ~20-30 min: builds Emscripten dependencies, then RDKit, in containers; then runs tests.js
      - name: Build and test
        env:
          BUILDROOT: ${{ runner.temp }}/rdkit
          COMPOSE_BAKE: "false"
        run: bash Scripts/windows_java_build/build-wasm.sh

      - name: Show result
        run: ls -l "$RUNNER_TEMP/rdkit/wasm/build/dist"

      - uses: actions/upload-artifact@v4
        with:
          name: rdkit-wasm
          path: ${{ runner.temp }}/rdkit/wasm/build
          if-no-files-found: error
          retention-days: 30

      - name: Publish to JFrog
        if: ${{ inputs.publish }}
        env:
          BUILDROOT: ${{ runner.temp }}/rdkit
          VERSION: ${{ inputs.version }}
          JFROG_USERNAME: ${{ secrets.JFROG_USERNAME }}
          JFROG_ACCESS_TOKEN: ${{ secrets.JFROG_ACCESS_TOKEN }}
          JFROG_URL: ${{ vars.JFROG_MAVEN_URL || 'https://certara.jfrog.io/artifactory/certara-maven-develop-local' }}
          JFROG_REPO_ID: certara-jfrog-admin
        run: |
          [ -n "$JFROG_USERNAME" ] && [ -n "$JFROG_ACCESS_TOKEN" ]             || { echo "::error::secrets JFROG_USERNAME and JFROG_ACCESS_TOKEN are required to publish"; exit 1; }
          mkdir -p ~/.m2
          # credentials are read from the environment at deploy time, never written to disk
          cat > ~/.m2/settings.xml <<'EOF'
          <settings>
            <servers>
              <server>
                <id>certara-jfrog-admin</id>
                <username>${env.JFROG_USERNAME}</username>
                <password>${env.JFROG_ACCESS_TOKEN}</password>
              </server>
            </servers>
          </settings>
          EOF
          bash Scripts/windows_java_build/publish-jfrog-wasm.sh
